    flatten-nested-objects-to-scalars precedent. REZOPS_DRIVE_TOKEN is a
    separate credential from REZOPS_CALENDAR_TOKEN despite the same Google
    OAuth ecosystem (AD-7). Apply every hardening lesson from every prior
    connector's review, including CMDB's regression: redaction must cover
    both the non-2xx AND malformed-200-body error branches, not just one.
- id: "15"
  title: "SharePoint connector"
