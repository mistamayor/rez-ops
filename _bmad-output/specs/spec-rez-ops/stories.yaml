- id: "1"
  title: Shared schema + ledger-core foundation
  description: >-
    Establish the shared RawFact/LedgerRecord schema module and ledger-core's
    append-only event log with materialized projection (SPEC CAP-1). No real
    connector yet — proven against synthetic facts.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Implements AD-3 (append-only log + projection) and AD-4/AD-9 (shared
    schema, RawFact vs LedgerRecord split). No real connector needed yet —
    exercise against synthetic RawFacts.
- id: "2"
  title: "First connector: git"
  description: >-
    Build the git connector as the first Sensor, proving the read-only
    fetch-and-normalize pattern into RawFact (SPEC CAP-2, partial).
  spec_checkpoint: false
  done_checkpoint: false
  invoke_dev_with: >-
    Implements AD-1/AD-2 (Sensor pattern, domain-prefixed tool naming, e.g.
    git_list_items). Establishes the connector pattern later connectors
    repeat.
- id: "3"
  title: Confidence and coverage computation
  description: >-
    Ledger-core computes confidence (agent-verified/manual/unknown) and a
    coverage map from ingested RawFacts (SPEC CAP-3).
  spec_checkpoint: false
  done_checkpoint: false
  invoke_dev_with: >-
    Implements AD-5 (ledger-core-only confidence/coverage computation) using
    Story 2's git connector as the first real data source.
- id: "4"
  title: Chat-queryable live state
  description: >-
    Expose ledger-core's current state through MCP tools a runtime can query
    in natural language — what's stale, what's due, what needs attention
    (SPEC CAP-4).
  spec_checkpoint: false
  done_checkpoint: false
  invoke_dev_with: >-
    Runtime-facing MCP query surface per the paradigm's Voice layer (AD-1) —
    read-only presentation of ledger-core state, no domain logic in the
    runtime.
- id: "5"
  title: "Ticketing connector: ServiceNow"
  description: >-
    Second Sensor: ticketing_get_ticket_status against ServiceNow's Table
    API (SPEC CAP-2). Split off from the original bundled "calendar,
    ticketing, CMDB" story since each connector is independently shippable.
  spec_checkpoint: false
  done_checkpoint: false
  invoke_dev_with: >-
    Implements AD-1/AD-2 against a real external HTTP API for the first
    time (git was a local subprocess). No auto-correlation — caller
    supplies the exact table/sys_id.
- id: "6"
  title: "Calendar connector: Google Calendar"
  description: >-
    Third Sensor: calendar_get_event_status against the Google Calendar API
    v3 (SPEC CAP-2). Further split from a "both Google and Microsoft 365"
    ask; Microsoft 365 tracked in deferred-work.md.
  spec_checkpoint: false
  done_checkpoint: false
  invoke_dev_with: >-
    Flattens Google's nested start/end/organizer fields to scalars — apply
    every hardening lesson already found in the ticketing connector's
    review from the start.
- id: "7"
  title: "CMDB connector: ServiceNow"
  description: >-
    Fourth and last connector from the original brief's brainstormed scope:
    cmdb_get_ci_status against ServiceNow's Table API (SPEC CAP-2
    completion). Closes out CAP-2.
  spec_checkpoint: false
  done_checkpoint: false
  invoke_dev_with: >-
    Independent connector server from ticketing despite sharing a vendor
    (AD-2) — separate credentials, no shared code. Apply every hardening
    lesson from ticketing's and calendar's reviews from the start.
- id: "8"
  title: Ownership inference and arbitration
  description: >-
    Implement the per-field ownership map and orphan-risk escalation across
    the now-multiple connectors reporting ownership-bearing fields (SPEC
    CAP-5) — the brief's wedge feature.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Implements AD-10: per-field ownership map, conflicting RawFacts logged
    not overwritten, absence of any signal escalates to confidence=unknown
    plus the orphan-risk list. Four connectors now exist (git, ticketing,
    calendar, CMDB) to exercise arbitration against a real overlapping
    field (e.g. escalation_owner).
- id: "9"
  title: Draft-not-send outbound content
  description: >-
    Add ledger-core's dedicated write tool and git-tracked drafts queue for
    agent-authored outbound content, with no auto-send path (SPEC CAP-6).
  spec_checkpoint: false
  done_checkpoint: false
  invoke_dev_with: >-
    Implements AD-6: drafts are created only via ledger-core's write tool,
    never a direct filesystem write from any other component.
- id: "10"
  title: Periodic briefing
  description: >-
    Generate a ranked briefing from the same live state Story 4's queries
    return, with a swappable delivery view (SPEC CAP-7).
  spec_checkpoint: false
  done_checkpoint: false
  invoke_dev_with: >-
    Briefing content must match what Story 4's live query returns at the
    same point in time (CAP-7 success criterion) — same underlying read
    path, different presentation.
- id: "11"
  title: Scheduled headless operation
  description: >-
    Wire the briefing to OS-scheduled headless invocation with explicit
    failure logging, never failing silently (SPEC CAP-8).
  spec_checkpoint: false
  done_checkpoint: false
  invoke_dev_with: >-
    Implements AD-7's scheduled-run rule: invoke via
    "claude -p --mcp-config .mcp.json --output-format json" (never --bare);
    failures append to ledger_data/_ops.log.md rather than failing silently.
- id: "12"
  title: Evidence boundary
  description: >-
    Add EvidenceBundle to the shared schema and a ledger-core write tool
    that computes its confidence server-side -- never accepted from the
    caller (SPEC CAP-9).
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Implements AD-11. The load-bearing rule: ledger-core -- never Voice --
    computes EvidenceBundle.confidence, using one documented method (exact
    formula deferred, same pattern as AD-5's confidence formula). A
    caller-supplied confidence value is a schema violation, exactly like a
    connector-supplied tier_sla under AD-9. EvidenceRef is a structured
    {source, field} object, never a bare string. Stored one file per
    bundle at ledger_data/evidence/{evidence_id}.md, created-only (no
    update/delete) -- mirrors Draft's simple lifecycle (AD-6), not AD-3's
    log-and-projection pattern, since a bundle is never itself approved or
    denied.
- id: "13"
  title: ActionProposal and the Policy Engine
  description: >-
    Add ActionProposal to the shared schema and ledger-core's policy
    evaluation -- Voice proposes an action citing evidence, ledger-core
    alone computes policy_decision (SPEC CAP-10). No executor: nothing
    consumes policy_decision to act.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Implements AD-12. Depends on Story 12's EvidenceBundle -- every
    ActionProposal must cite at least one. The action vocabulary is
    exactly rezops.policy.yaml's top-level keys, no other source, no
    freeform names; naming an undeclared action or citing no evidence is
    rejected before anything is recorded. Ledger-core -- never Voice --
    computes policy_decision (automatic | requires_approval | denied)
    from the named action's config-declared risk/impact, the target's
    criticality (a target with no LedgerRecord/tier_sla yet resolves to
    the most conservative tier, never a guess, mirroring AD-10), and the
    MINIMUM confidence across every cited EvidenceBundle (never an
    average). A caller-supplied policy_decision is a schema violation.
    Unlike Draft/EvidenceBundle, ActionProposal has a real lifecycle
    (proposed, then decided), so it extends AD-3's append-only/projection
    discipline to one flat log, ledger_data/action_proposals.log.md
    (proposed/decided events) -- never one-file-per-proposal, and never a
    hand-edited field on an in-place record. Never clause is structural,
    not temporal: nothing acts on policy_decision regardless of value --
    not an external call, not an internally-triggered Draft write, not any
    other component's write path. No Executor exists or is built in this
    story.
- id: "14"
  title: "Google Drive connector"
  description: >-
    Fifth Sensor: google_drive_get_document_status against the Google
    Drive API v3 (SPEC CAP-2 extension). Closes a real gap: BIAs/RACI/
    tiering docs often live as Drive files, not git/ServiceNow/Calendar/
    CMDB records.
  spec_checkpoint: false
  done_checkpoint: false
  invoke_dev_with: >-
    Implements AD-1/AD-2 against Google Drive API v3. Last-modified
    metadata only (modifiedTime, lastModifyingUser flattened to a scalar)
    -- mirrors calendar_get_event_status's shape and its
    flatten-nested-objects-to-scalars precedent. REZOPS_DRIVE_TOKEN is a
    separate credential from REZOPS_CALENDAR_TOKEN despite the same Google
    OAuth ecosystem (AD-7). Apply every hardening lesson from every prior
    connector's review, including CMDB's regression: redaction must cover
    both the non-2xx AND malformed-200-body error branches, not just one.
- id: "15"
  title: "SharePoint connector"
  description: >-
    Sixth Sensor: a document-status connector against Microsoft Graph API
    (SPEC CAP-2 extension), matching Story 14's shape. New auth pattern
    for this project -- Microsoft Graph, not Google OAuth or ServiceNow
    tokens.
  spec_checkpoint: false
  done_checkpoint: false
  invoke_dev_with: >-
    Implements AD-1/AD-2 against Microsoft Graph API. Last-modified
    metadata only, mirroring Story 14's exact shape and every prior
    connector's hardening lessons (typed error hierarchy, URL-encoding,
    HTTPS-only validation, redaction on every error branch). Independent
    credentials from every other connector, even one already targeting a
    Microsoft-adjacent system.
