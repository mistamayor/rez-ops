    Microsoft-adjacent system.
- id: "16"
  title: "Cross-cutting connector and ledger-core hardening"
  description: >-
    Fix the four converged, well-evidenced gaps accumulated in
    deferred-work.md across Stories 1-15's reviews: a non-injective
    `_build_source` collision (6 connectors), an unstripped credential
    (5 connectors), a non-ASCII-credential UnicodeEncodeError risk (5
    connectors), and `get_record`'s missing fail-open on a corrupted log
    (ledger_core). No new capability -- hardens CAP-1/CAP-2/CAP-3's
    existing implementations. ~35 lower-priority deferred items
    explicitly left as-is per user direction.
  spec_checkpoint: true
  done_checkpoint: false
  invoke_dev_with: >-
    Four independent fixes, each cited by >=2 converged findings across
    prior stories' reviews. (1) `_build_source`: sanitize each identifier
    segment individually before joining with "/", not the whole
    concatenated string at once -- since "/" is itself in the sanitized-
    away charset, joining post-sanitization guarantees the separator can
    never appear inside a segment, making the join injective. Applies to
    git_repo, ticketing, calendar_google, cmdb, google_drive, sharepoint.
    (2) `_read_credential`/`_read_credentials`: strip the token before
    returning it (every other value in these modules is already
    `.strip()`ped) and reject a non-ASCII credential the same way a
    control character is already rejected (typed error, before any HTTP
    request) -- ticketing, calendar_google, cmdb, google_drive,
    sharepoint. (3) `ledger_core.projection.get_record`: catch
    `LogFormatError` around its `_fold_events_by_artifact` call and
    degrade to the same empty-fields/unknown-confidence record it already
    returns for a never-observed artifact -- extending its own documented
    "never raises for a missing artifact" invariant to also cover a
    corrupted log, consistent with `list_records`/`get_coverage_map`'s
    existing AD-8 treatment of the identical failure. Once `get_record`
    itself never raises `LogFormatError`, remove the now-redundant
    try/except around its call site in
    `action_proposals.create_action_proposal` (simplification only, no
    behavior change).
- id: "17"
  title: "Tier assignment & DR risk classification"
  description: >-
    Populate tier_sla/expiry_rule -- present in the LedgerRecord schema since
    Story 1 but left None by every story since ("no tiering data source
    exists yet") -- from a new git-tracked tier-assignment config, and
    compute a DR risk level (high/medium/low) from tier x freshness x
    confidence (SPEC CAP-11). Unblocks CAP-10's policy engine: its
    "automatic" branch requires tier_sla_known=true, which is always false
    today.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Implements CAP-11. New config file declares an artifact_type/artifact_id
    -> tier mapping and each tier's expiry-rule SLA, mirroring
    rezops.policy.yaml's existing declare-in-config/ledger-core-computes-the-
    derived-value pattern (AD-12) -- never a connector-supplied or
    caller-supplied tier_sla/risk value (extends AD-5/AD-9's existing
    discipline, same constraint class as EvidenceBundle.confidence and
    ActionProposal.policy_decision). An artifact with no declared tier
    resolves to the most conservative reading (risk unknown), never a guess,
    mirroring AD-10's no-signal-escalates discipline. Exact risk formula
    (how freshness/confidence combine with tier's expiry rule into
    high/medium/low) is this story's own design decision to make and
    document, not prescribed here.
- id: "18"
  title: "DR readiness summary query"
  description: >-
    One new read-only MCP tool aggregating risk/RAG status across three
    independent axes -- application tier, infrastructure, data centres --
    in a single call, extending CAP-4's existing chat-queryable live state
    (not a new capability). Mirrors ledger_get_briefing's existing shape:
    composes other read tools' results, no write of any kind.
  spec_checkpoint: true
  done_checkpoint: false
  invoke_dev_with: >-
    Extends CAP-4. Depends on Story 17's computed tier_sla/risk fields
    existing -- read-only, data endpoint only, no UI. Three independent
    axes means a caller can ask about tier readiness, infrastructure
    readiness, and data-centre readiness as separate rollups in one
    response, not one flattened list (a real nuance surfaced by cross-
    checking against a reference DR-portal design during roadmap planning).
- id: "19"
  title: "DR test achievement signals"
  description: >-
    For a DR test result artifact, compute RTO/RPO achieved as a percentage
    of target (not bare pass/fail), and flag whether it ran inside the
    program's mandated annual testing window as an independent compliance
    signal regardless of pass/fail (SPEC CAP-12).
  spec_checkpoint: true
  done_checkpoint: false
  invoke_dev_with: >-
    Implements CAP-12. Both values are ledger-core-computed from a DR test
    result artifact's own fields (target/actual recovery-time fields for
    RTO/RPO; a scheduled-date field compared against a config-declared
    annual window) -- never accepted as connector/caller input, same
    discipline as Story 17. Independent of Stories 17/18: operates on
    test-result artifacts directly, no dependency on tier_sla existing.
- id: "20"
  title: "Executive dashboard generator"
  description: >-
    A new script, ops/generate_dashboard.py, generates a self-contained
    static HTML snapshot of current DR readiness from real ledger state --
    no hosted server, regenerate-on-demand (SPEC CAP-13). Only the Home
    view (KPI tiles + RAG status) is wired to real data in this pass; other
    prototype views (dependency map, evidence Q&A, test scheduling) have no
    real data source yet and stay visibly labeled as such.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Implements CAP-13. Mirrors ops/run_scheduled_briefing.py's existing
    location/operational-script convention -- a non-interactive, non-Voice
    consumer of ledger-core's already-existing read surface
    (get_dr_readiness_summary, list_records, get_briefing), no new
    computation. KPI tiles are redesigned around Rez Ops's own real
    capabilities (total artifacts tracked, orphan-risk count,
    unknown-confidence count, pending drafts, tiers at high/medium risk,
    data-quality issues) rather than re-skinning the prototype's
    CEVA-specific tile set with real numbers substituted in -- that
    redesign is this story's own design decision to make and document.
    Visual design (palette, typography, confidence-dot device) is already
    validated in the iterated Claude Artifact prototype from roadmap
    planning; this story's job is wiring real data into that validated
    shape, not re-designing it. Views with no real backing data source
    (dependency map, "Ask Rez Ops", upcoming/recent test tables) remain in
    the generated page but must be visibly and honestly labeled as
    not-yet-wired -- never populated with fabricated numbers presented as
    real. User-confirmed checkpoints reflect this project's history with
    dashboards (built and rejected twice before this cycle): review both
    the plan and the finished result.
- id: "21"
  title: "Agent runtime core, fake adapter, and the contract suite"
  description: >-
    The Phase 1 spike: inspect the three real runtimes, then fix the
    AgentProvider interface and build agents/core, the agent_data/ event
    store, the in-process fake adapter, tests/providers/, and the rezops
    CLI (doctor, agent run --provider fake) (SPEC CAP-14/15/16 partial,
    CAP-18 fake). Nothing in ledger_core/, connectors/, or shared/ changes.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Implements AD-16/17/18/20 for the fake provider, and sets (never reads)
    the AD-19 environment. Order inside the story: inspect Claude Code,
    Codex CLI, and Antigravity CLI first (docs/provider-adapter-contract.md
    section 12 is the verified starting matrix; re-probe), THEN fix the
    AgentProvider method signatures -- the plan's own rule is no premature
    fake abstractions. agents/core mints a UUID session_id before any
    launch, sets REZOPS_AGENT_SESSION_ID/PROVIDER/MODE=driven/AUTH_MODE,
    emits every AD-18 event type with payload shapes defined once and
    versioned in agents/core, and appends only to agent_data/sessions/
    using ledger_core/log.py's line grammar as the reference (read it, do
    not import ledger_core). Agent failure codes live in agents/core for
    Phase 1 (user decision; Phase 3 relocates them into shared/failures) --
    a closed set, add-with-a-test. The fake runs in-process, launches no
    binary, simulates a full session end to end, and can inject every
    failure code; if the fake needs a special case in tests/providers/, the
    suite is wrong. rezops doctor probes without launching a session by
    default; --live is a full driven session under every AD. Exit bar:
    rezops agent run --provider fake works; rezops doctor reports the fake
    by probe and this machine's Codex install as not installed. 820
    existing tests still pass untouched. Definition of done is
    docs/provider-adapter-contract.md section 11.
- id: "22"
  title: "Claude Code adapter"
  description: >-
    First real provider: agents/providers/claude launches claude -p headless
    against .mcp.json in strict MCP-config mode, enforces tool scope, and
    forwards provenance by name (SPEC CAP-14/15/18 claude). Also turns
    ops/run_scheduled_briefing.py into a thin shim over rezops agent run
    --provider claude, closing CAP-8's grandfathered exception.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Implements AD-16/17/19/20 for Claude Code (2.1.269 verified 2026-09-12;
    re-probe -- headless MCP loading regressed once in 2.1.77). Launch in
    the project root with --mcp-config .mcp.json --strict-mcp-config
    --output-format stream-json and --session-id/--resume for sessions;
    never --bare, never --dangerously-skip-permissions. Deny built-in
    shell, file-write, and web tools through Claude's own permission
    mechanism; before the first task compare the reported loaded-server
    set to .mcp.json and fail with TOOL_SCOPE_VIOLATION on any difference;
    fail with MCP_ATTACH_FAILED if not every server attaches. Confirm the
    ledger-core child process inherits the four REZOPS_AGENT_* variables
    by name; if Claude whitelists the environment passed to MCP children,
    solve it by name, never by writing values into a generated file --
    PROVENANCE_UNAVAILABLE otherwise. Probe auth_mode and refuse to launch
    with AUTH_MODE_MISMATCH if an ambient ANTHROPIC_API_KEY would flip a
    subscription session to API without opt-in. The vendor's name, flags,
    and output schema appear only inside this package. Must pass Story
    21's tests/providers/ with no adapter-specific skips, plus the four
    negative launches in docs/provider-adapter-contract.md section 11.
- id: "23"
  title: "OpenAI Codex CLI adapter"
  description: >-
    agents/providers/codex derives a per-run config.toml from .mcp.json,
    launches codex exec headless, and proves the probe distinguishes a
    wrapper-present-binary-missing install from a working one (SPEC CAP-18
    codex).
  spec_checkpoint: true
  done_checkpoint: false
  invoke_dev_with: >-
    Implements AD-16/17/19/20 for Codex CLI (verified from vendor docs
    2026-09-12; pin the npm @openai/codex version when built). Derive
    [mcp_servers.*] TOML into .rezops/run/{session_id}/ from .mcp.json --
    never hand-maintain a second list, never commit it; confirm the
    strict/isolated MCP-config equivalent so ~/.codex/config.toml (which
    on this machine already registers an extra server) cannot merge in, or
    fail the launch. Never set CODEX_HOME elsewhere (it relocates auth) and
    never read ~/.codex/auth.json. codex exec --json for events,
    --output-schema for structured results, codex exec resume for
    sessions; read-only sandbox stays the default. Same contract suite,
    same negative launches as Story 22.
- id: "24"
  title: "Google Antigravity CLI adapter"
  description: >-
    agents/providers/google derives .agents/mcp_config.json from .mcp.json
    and launches agy -p headless, judging health and tool scope from the
    JSON envelope because a denied tool call exits 0 (SPEC CAP-18 google).
    Antigravity, not the retired Gemini CLI subscription route.
  spec_checkpoint: true
  done_checkpoint: false
  invoke_dev_with: >-
    Implements AD-16/17/19/20 for Antigravity CLI agy 1.2.0 (verified
    2026-09-12, releases roughly weekly -- pin when built). Gemini CLI
    stopped serving Google AI Pro/Ultra on 2026-06-18; do not target it.
    Derive .agents/mcp_config.json per run (stdio shape matches .mcp.json;
    all 7 Rez Ops servers are stdio); confirm the isolation equivalent so
    ~/.gemini/config/mcp_config.json cannot merge in, or fail the launch;
    never relocate ~/.gemini. A denied tool call exits 0 with status
    SUCCESS and a stderr notice only -- judge healthy/authenticated/scope
    from the structured result and denial notices, never the exit code;
    unauthenticated headless exits non-zero. Use permissions.allow for
    the MCP tools, never --dangerously-skip-permissions. --continue /
    --conversation <id> for sessions. Same contract suite, same negative
    launches as Story 22.
