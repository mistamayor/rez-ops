[project]
name = "rez-ops"
version = "0.1.0"
description = "Rez Ops — AI agent framework for Disaster Recovery program management"
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.29,<2",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared", "ledger_core", "connectors"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
